# codeguard:components:start
# Source: docker-compose.yml
# Declarations and references retain their native language names and order.
# codeguard:components:end
services:
  db:
    image: postgres:16-alpine
    container_name: ahmadmakatreh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ahmad_makatreh_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ahmad_makatreh_prod"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ahmadmakatreh_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Persistence__Provider: Postgres
      Persistence__AutoMigrateInDevelopment: "true"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ahmad_makatreh_prod;Username=postgres;Password=postgres_secure_local_dev
      Turnstile__Enabled: "false"
      Turnstile__AllowDevelopmentBypass: "true"
      ReverseProxy__TrustCloudflareProxy: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
